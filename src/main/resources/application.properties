# Spring Boot Application Name
spring.application.name=Testlytics

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/testlytics_db
spring.datasource.username=postgres  # Keeping Adith's username
spring.datasource.password=adithzpw  # Keeping Adith's password
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate (JPA) Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration (From Swetha's branch)
jwt.secret=12345678901234567890123456789012
jwt.expiration-in-ms=3600000
